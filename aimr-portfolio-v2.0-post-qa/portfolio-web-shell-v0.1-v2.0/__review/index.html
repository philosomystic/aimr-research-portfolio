<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prospective Research responsive review</title><style>body{margin:0;background:#edf0ee;font:14px system-ui}header{position:sticky;top:0;padding:12px 16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:white;border-bottom:1px solid #aaa;z-index:2}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px}main{padding:16px;overflow:auto}iframe{display:block;border:1px solid #aaa;background:white;box-sizing:content-box;height:900px}</style><header><strong>Responsive review</strong><label>Page<select id="page"><option value="/research/">Research</option><option value="/research/experimental-program/#prospective-research">Prospective Research</option><option value="/research/experimental-program/wunderhorn/">Wunderhorn</option><option value="/research/experimental-program/developmental-dashboard/">Dashboard</option><option value="/research/experimental-program/wayfinder/">Wayfinder</option><option value="/research/experimental-program/research-methodology-acquisition/">Methodology</option></select></label><label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>620</option><option>768</option><option>1280</option></select></label><label>Text size<select id="size"><option value="100">100%</option><option value="200">200%</option></select></label></header><main><iframe id="preview" title="Portfolio preview" style="width:390px" src="/research/"></iframe></main><script>const frame=document.querySelector('#preview');document.querySelector('#page').addEventListener('change',e=>frame.src=e.target.value);document.querySelector('#width').addEventListener('change',e=>frame.style.width=e.target.value+'px');const resizeText=()=>frame.contentDocument.documentElement.style.fontSize=document.querySelector('#size').value+'%';frame.addEventListener('load',resizeText);document.querySelector('#size').addEventListener('change',resizeText);</script></html>
