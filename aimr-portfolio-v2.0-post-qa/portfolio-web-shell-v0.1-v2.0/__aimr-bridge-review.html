<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIMR bridge responsive review</title>
<style>
body{margin:0;background:#edf0ee;font:14px system-ui}
header{position:sticky;top:0;padding:12px 16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:white;border-bottom:1px solid #aaa;z-index:2}
label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px}
main{padding:16px;overflow:auto}iframe{display:block;border:1px solid #aaa;background:white;box-sizing:content-box;height:1250px}
</style>
<header><strong>AIMR bridge review</strong>
<label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>620</option><option>768</option><option>1024</option><option>1280</option></select></label>
<label>Text size<select id="size"><option value="100">100%</option><option value="200">200%</option></select></label>
<button id="bridge">Back to bridge</button>
</header>
<main><iframe id="preview" title="AIMR portfolio preview" style="width:390px" src="/research/aimr/#prospective-research-bridge"></iframe></main>
<script>
const frame=document.querySelector('#preview');
const positionBridge=()=>frame.contentDocument.getElementById('prospective-research-bridge')?.scrollIntoView();
const resizeText=()=>{frame.contentDocument.documentElement.style.fontSize=document.querySelector('#size').value+'%';positionBridge();};
document.querySelector('#width').addEventListener('change',e=>{frame.style.width=e.target.value+'px';positionBridge();});
frame.addEventListener('load',resizeText);
document.querySelector('#size').addEventListener('change',resizeText);
document.querySelector('#bridge').addEventListener('click',()=>{frame.src='/research/aimr/#prospective-research-bridge';positionBridge();});
</script>
</html>
